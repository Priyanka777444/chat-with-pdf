name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Lint with flake8
        run: |
          flake8 . \
            --count \
            --max-line-length=110 \
            --extend-exclude=venv,.venv,Finance/venv,Flask/.venv,mlruns,faiss_store,.git \
            --select=E9,F63,F7,F82,F401,F811,F841 \
            --show-source \
            --statistics

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build Docker image
        run: docker build -t chat-with-pdf .